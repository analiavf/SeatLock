<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SeatLock | Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="index.html"><span class="brand-icon"><img src="img/seatlock-logo-icon.svg" alt=""></span> SeatLock</a>
    <h1>Criar conta</h1>
    <p class="muted">Preencha seus dados para começar.</p>

    <!-- Em produção, envie os dados para uma rota POST do backend. -->
    <form action="#" method="post">
      <label for="nome">Nome completo</label>
      <input id="nome" name="nome" autocomplete="name" required>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" required>

      <button class="btn btn-primary" type="button" onclick="alert('Demonstração: conecte este formulário ao backend para cadastrar de verdade.')">Criar conta (demonstração)</button>
    </form>
    <p class="muted center">Já tem conta? <a href="index.html">Entrar</a></p>
  </main>
</body>

</html>
