<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F212B"/>
      <stop offset="100%" stop-color="#14151B"/>
    </linearGradient>
    <linearGradient id="seatGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC670"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <rect x="0" y="0" width="200" height="200" rx="46" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="200" height="200" rx="46" fill="none" stroke="#34384433" stroke-width="1"/>

  <!-- Seat node (mesmo círculo usado no mapa de assentos e no diagrama de arquitetura) -->
  <circle cx="100" cy="100" r="56" fill="url(#seatGrad)"/>
  <circle cx="100" cy="100" r="56" fill="none" stroke="#FFFFFF22" stroke-width="1.5"/>

  <!-- Keyhole (fechadura), cortado na cor do fundo -->
  <circle cx="100" cy="88" r="10.5" fill="#181A22"/>
  <rect x="93" y="90" width="14" height="30" rx="4" fill="#181A22"/>

  <!-- Live dot: mesmo estilo do indicador "servidor ativo" do sistema -->
  <circle cx="150" cy="150" r="11" fill="#121319"/>
  <circle cx="150" cy="150" r="7" fill="#4DD0C4"/>
  <circle cx="150" cy="150" r="11" fill="none" stroke="#4DD0C4" stroke-width="1.4" opacity="0.55"/>
</svg>
